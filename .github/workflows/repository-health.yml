name: Repository health audit

on:
  push:
    branches: [gh-pages]
  pull_request:
    branches: [gh-pages]
  schedule:
    - cron: "23 5 * * 1"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: repository-health-${{ github.ref }}
  cancel-in-progress: true

jobs:
  audit:
    name: Documentation and generated-site integrity
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Run offline audit unit tests
        run: python3 -m unittest discover -s tests -v

      - name: Audit local references, anchors, and external URLs
        run: python3 scripts/repository_health_audit.py --root . --report repository-health-report.md --json-report repository-health-report.json --check-external --max-external 80

      - name: Upload audit evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: repository-health-report
          path: |
            repository-health-report.md
            repository-health-report.json
          if-no-files-found: warn
          retention-days: 30
